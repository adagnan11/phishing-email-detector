<!DOCTYPE html>
<html>
<head>
    <title>Phishing Email Detector</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #38bdf8;
        }

        textarea {
            width: 60%;
            height: 150px;
            border-radius: 10px;
            padding: 10px;
            border: none;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h1>🔐 Phishing Email Detector</h1>

<form method="POST">
    <textarea name="email" placeholder="Paste email here..."></textarea><br>
    <button type="submit">Analyze</button>
</form>

{% if prediction %}
    <div class="result">
        <p>{{ prediction }}</p>
        <p>Confidence: {{ probability }}%</p>
    </div>
{% endif %}

</body>
</html>
