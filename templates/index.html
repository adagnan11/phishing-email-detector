<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
</head>
<body>

<h2>Phishing Email Detector</h2>

<form method="POST">
    <textarea name="email" rows="10" cols="50" placeholder="Paste email here"></textarea><br><br>
    <button type="submit">Check</button>
</form>

{% if prediction %}
    <h3>{{ prediction }}</h3>
    <p>Confidence: {{ probability }}%</p>
{% endif %}

</body>
</html>
